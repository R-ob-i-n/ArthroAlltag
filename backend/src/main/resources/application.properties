spring.application.name=backend

# Nur fuer die Entwicklung - fuer den Produktivbetrieb ueber eine Umgebungsvariable setzen!
app.jwt.secret=ThisIsADevOnlySecretKeyForTherapieManagementJWT1234567890

# H2 In-Memory-Datenbank mit festem Namen (statt zufaelliger UUID), damit die H2-Console
# bei jedem Start dieselbe Verbindung findet.
spring.datasource.url=jdbc:h2:mem:therapiedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema bei jedem Start aus den Entities neu aufbauen (drop-and-create) - passend fuer die
# Entwicklung, in Produktion wuerde man stattdessen Migrationen (z.B. Flyway) nutzen.
spring.jpa.hibernate.ddl-auto=create-drop

# Ohne dieses Flag fuehrt Spring Boot data.sql VOR der Hibernate-Schemaerstellung aus - die
# Inserts wuerden dann gegen eine leere Datenbank ohne Tabellen laufen und fehlschlagen.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

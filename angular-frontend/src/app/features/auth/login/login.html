<div class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-md p-8">
    <h1 class="text-2xl font-semibold text-slate-900 mb-6 text-center">Anmelden</h1>

    <form (submit)="$event.preventDefault(); onSubmit()" class="space-y-5">
      <div>
        <label for="userId" class="block text-base font-medium text-slate-700 mb-1">Benutzer-ID</label>
        <input
          id="userId"
          type="text"
          autocomplete="username"
          [value]="userId()"
          (input)="onUserIdInput($event)"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label for="password" class="block text-base font-medium text-slate-700 mb-1">Passwort</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          [value]="password()"
          (input)="onPasswordInput($event)"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <app-error-message [message]="errorMessage()" />

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full rounded-lg bg-blue-600 text-white text-lg font-medium py-3 hover:bg-blue-700 disabled:opacity-50 transition-colors"
      >
        {{ isLoading() ? 'Anmelden ...' : 'Anmelden' }}
      </button>
    </form>
  </div>
</div>

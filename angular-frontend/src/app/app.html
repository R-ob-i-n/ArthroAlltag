<div class="min-h-screen bg-slate-50">
  <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between">
    <span class="text-xl font-semibold text-slate-900">Meine Therapie</span>

    @if (authService.isLoggedIn()) {
      <div class="flex items-center gap-4">
        <span class="text-slate-600">
          {{ authService.currentUser()?.vorname }} {{ authService.currentUser()?.nachname }}
        </span>
        <button
          type="button"
          (click)="onLogout()"
          class="rounded-lg border border-slate-300 px-4 py-2 text-base font-medium text-slate-700 hover:bg-slate-100 transition-colors"
        >
          Abmelden
        </button>
      </div>
    }
  </header>

  <router-outlet />
</div>
